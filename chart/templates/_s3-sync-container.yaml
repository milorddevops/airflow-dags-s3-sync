{{- define "s3Sync.container" -}}
{{- if .Values.dags.s3Sync.enabled -}}
{{- $s3Image := .Values.dags.s3Sync.image -}}
- name: s3-dag-sync
  {{- if $s3Image }}
  image: {{ printf "%s:%s" $s3Image.repository $s3Image.tag }}
  imagePullPolicy: {{ $s3Image.pullPolicy | default "IfNotPresent" }}
  {{- else }}
  image: {{ template "airflow_image" $ }}
  imagePullPolicy: {{ .Values.images.airflow.pullPolicy }}
  {{- end }}
  securityContext: {{ include "containerSecurityContext" (list .Values.dags.s3Sync .) | nindent 4 }}
  {{- if .is_init }}
  command: ["/usr/bin/dumb-init", "--", "/usr/local/bin/sync-dags-from-s3", "--once"]
  {{- else }}
  command: ["/usr/bin/dumb-init", "--", "/usr/local/bin/sync-dags-from-s3"]
  {{- end }}
  env:
    - name: S3_BUCKET
      value: {{ required "S3 bucket is required when s3Sync is enabled" .Values.dags.s3Sync.bucket | quote }}
    {{- if .Values.dags.s3Sync.accessKeyId }}
    - name: S3_ACCESS_KEY_ID
      value: {{ .Values.dags.s3Sync.accessKeyId | quote }}
    {{- else if .Values.dags.s3Sync.accessKeyIdSecretName }}
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: {{ .Values.dags.s3Sync.accessKeyIdSecretName | quote }}
          key: access-key-id
    {{- end }}
    {{- if .Values.dags.s3Sync.secretAccessKey }}
    - name: S3_SECRET_ACCESS_KEY
      value: {{ .Values.dags.s3Sync.secretAccessKey | quote }}
    {{- else if .Values.dags.s3Sync.secretAccessKeySecretName }}
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.dags.s3Sync.secretAccessKeySecretName | quote }}
          key: secret-access-key
    {{- end }}
    {{- if .Values.dags.s3Sync.endpointUrl }}
    - name: S3_ENDPOINT_URL
      value: {{ .Values.dags.s3Sync.endpointUrl | quote }}
    {{- end }}
    - name: S3_REGION
      value: {{ .Values.dags.s3Sync.region | quote }}
    {{- if .Values.dags.s3Sync.dagsPrefix }}
    - name: S3_DAGS_PREFIX
      value: {{ .Values.dags.s3Sync.dagsPrefix | quote }}
    {{- end }}
    - name: S3_VERIFY_SSL
      value: {{ .Values.dags.s3Sync.verifySsl | quote }}
    - name: S3_SYNC_INTERVAL_SECONDS
      value: {{ .Values.dags.s3Sync.syncIntervalSeconds | quote }}
    - name: S3_DELETE_EXTRA_LOCAL
      value: {{ .Values.dags.s3Sync.deleteExtraLocal | quote }}
    - name: S3_DOWNLOAD_ON_STARTUP
      value: {{ .Values.dags.s3Sync.downloadOnStartup | quote }}
    {{- if .Values.dags.s3Sync.env }}
    {{- tpl (toYaml .Values.dags.s3Sync.env) $ | indent 4 }}
    {{- end }}
  volumeMounts:
    {{- if .Values.volumeMounts }}
      {{- toYaml .Values.volumeMounts | nindent 4 }}
    {{- end }}
    {{- if .Values.dags.s3Sync.extraVolumeMounts }}
      {{- tpl (toYaml .Values.dags.s3Sync.extraVolumeMounts) $ | nindent 4 }}
    {{- end }}
    {{- if or .Values.dags.persistence.enabled .Values.dags.gitSync.enabled .Values.dags.s3Sync.enabled }}
    {{- include "airflow_dags_mount" . | nindent 4 }}
    {{- end }}
  resources: {{- toYaml .Values.dags.s3Sync.resources | nindent 4 }}
  {{- if and (not .is_init) .Values.dags.s3Sync.livenessProbe }}
  livenessProbe:
    initialDelaySeconds: {{ .Values.dags.s3Sync.livenessProbe.initialDelaySeconds }}
    periodSeconds: {{ .Values.dags.s3Sync.livenessProbe.periodSeconds }}
    timeoutSeconds: {{ .Values.dags.s3Sync.livenessProbe.timeoutSeconds }}
    exec:
      command:
        - sh
        - -c
        - pgrep -f "sync-dags-from-s3"
  {{- end }}
  {{- if and (not .is_init) .Values.dags.s3Sync.readinessProbe }}
  readinessProbe:
    initialDelaySeconds: {{ .Values.dags.s3Sync.readinessProbe.initialDelaySeconds }}
    periodSeconds: {{ .Values.dags.s3Sync.readinessProbe.periodSeconds }}
    timeoutSeconds: {{ .Values.dags.s3Sync.readinessProbe.timeoutSeconds }}
    exec:
      command:
        - sh
        - -c
        - pgrep -f "sync-dags-from-s3"
  {{- end }}
{{- end }}
{{- end }}